[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qde-nisq-qnn-benchmark"
version = "0.1.0"
description = "Source-only reference implementation for a NISQ-constrained quantum data encoding QNN study"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Quang-Hao Do"}]
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "Pillow>=11,<13",
  "qiskit==2.3.1",
  "qiskit-aer==0.17.2",
  "qiskit-ibm-runtime==0.47.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
qde-benchmark = "qde_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

